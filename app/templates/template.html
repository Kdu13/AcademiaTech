{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0c1b1b">
    <meta name="description" content="Cursos de tecnologia com prática, suporte e projetos reais.">
    <title>{% block titulo %}Início{% endblock %} | Academia Tech</title>
    <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml">
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=7">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="{% url 'index' %}" aria-label="Academia Tech, página inicial">
                <span class="brand-mark">A</span>
                <span>Academia<span class="brand-light"> Tech</span></span>
            </a>
            <nav class="main-nav" aria-label="Navegação principal">
                {% if user.is_authenticated %}
                    <a class="nav-cta" href="{% url 'dashboard' %}">Dashboard</a>
                    <form class="nav-logout-form" method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="nav-logout" type="submit">Sair</button></form>
                {% else %}
                    <a href="{% url 'quem_somos' %}">Quem Somos</a>
                    <a href="{% url 'produtos' %}">Produtos</a>
                    <a href="{% url 'novo_contato' %}">Contato</a>
                    <a class="nav-cta" href="{% url 'login' %}">Entrar</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="page-shell">
        {% block conteudo %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>Academia Tech <span>·</span> Aprenda tecnologia criando projetos reais.</p>
    </footer>
</body>
</html>
