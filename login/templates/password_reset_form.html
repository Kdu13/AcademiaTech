{% extends 'template.html' %}

{% block titulo %}Recuperar senha{% endblock %}

{% block conteudo %}
<section class="form-page">
    <a class="back-link" href="{% url 'login' %}">← Voltar para entrar</a>
    <div class="form-card">
        <span class="eyebrow eyebrow-dark">Recuperação segura</span>
        <h1>Esqueceu a senha?</h1>
        <p class="form-intro">Informe o e-mail da sua conta. Enviaremos as instruções para criar uma nova senha.</p>
        <form class="stacked-form" method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="button button-primary button-wide" type="submit">Enviar instruções</button>
        </form>
    </div>
</section>
{% endblock %}
